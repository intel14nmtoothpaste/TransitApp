name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Default Scheme
        run: |
          echo "scheme=TransitApp" >> "$GITHUB_ENV"
          echo "project=TransitApp.xcodeproj" >> "$GITHUB_ENV"
      - name: Build
        run: |
          device_id=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read)["devices"]
            device = devices.values.flatten.find { |item| item["name"].start_with?("iPhone") }
            abort("No available iPhone simulator found") unless device
            puts device["udid"]
          ')
          echo "Using simulator: $device_id"
          xcodebuild build-for-testing \
            -scheme "$scheme" \
            -project "$project" \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          device_id=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read)["devices"]
            device = devices.values.flatten.find { |item| item["name"].start_with?("iPhone") }
            abort("No available iPhone simulator found") unless device
            puts device["udid"]
          ')
          echo "Using simulator: $device_id"
          xcodebuild test-without-building \
            -scheme "$scheme" \
            -project "$project" \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO
